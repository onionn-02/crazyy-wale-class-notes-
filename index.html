<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Topper Tapri — find notes, tutorials, PYQs and important resources for every subject in one place." />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Topper Tapri</title>
    <script>
      (function () {
        // Cinematic dark is the flagship look, so new visitors land there
        // regardless of their device's light/dark setting. Once someone
        // picks a theme via the toggle, that explicit choice always wins.
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : true;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
