    <title>Topper Tapri</title>
    <script>
      (function () {
        // Cinematic dark is the flagship look, so new visitors land there
        // regardless of their device's light/dark setting. Once someone
        // picks a theme via the toggle, that explicit choice always wins.
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : true;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
